<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img"
     aria-labelledby="svg09-title svg09-desc">
  <title id="svg09-title">Primary Wood Based Industries: 588 to 206</title>
  <desc id="svg09-desc">A chart showing the decline in primary wood based industry
    units in Assam, from 588 registered units down to 206 after the 2022 Rules,
    with the delta annotated as a fall of 382 units and roughly 65 per cent.</desc>

  <defs>
    <linearGradient id="svg09-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="var(--color-green-light)" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="var(--color-gold)" stop-opacity="0.65"/>
    </linearGradient>
  </defs>

  <!-- Plot area: x 130..560 for the two bars, with room for annotations on the right -->
  <!-- Scale: 588 -> y 70 (top), 0 -> y 330. 270/588 = 0.4592 px per unit -->
  <g font-family="var(--font-sans)">

    <!-- Gridlines -->
    <g stroke="var(--color-cream)" stroke-opacity="0.1">
      <line x1="130" y1="70"  x2="560" y2="70"/>
      <line x1="130" y1="163" x2="560" y2="163"/>
      <line x1="130" y1="256" x2="560" y2="256"/>
      <line x1="130" y1="330" x2="560" y2="330" stroke-opacity="0.25"/>
    </g>
    <g fill="var(--color-cream)" fill-opacity="0.4" font-size="9.5" text-anchor="end">
      <text x="118" y="74">600</text>
      <text x="118" y="167">400</text>
      <text x="118" y="260">200</text>
      <text x="118" y="334">0</text>
    </g>
    <text x="130" y="52" fill="var(--color-cream)" fill-opacity="0.45" font-size="9"
          letter-spacing="0.1em">PRIMARY WBI UNITS IN ASSAM</text>

    <!-- Bar 1: 588 -> height 270, top 70 -->
    <g>
      <rect x="180" y="70" width="96" height="260" rx="2.5" fill="url(#svg09-bar)"/>
      <text x="228" y="58" text-anchor="middle" fill="var(--color-cream)" font-size="16"
            font-weight="700">588</text>
      <text x="228" y="352" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.75"
            font-size="11" font-weight="600">Before</text>
      <text x="228" y="368" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.45"
            font-size="8.5">WBI Rules 2000</text>
    </g>

    <!-- Bar 2: 206 -> height 95, top 235 -->
    <g>
      <rect x="420" y="235" width="96" height="95" rx="2.5" fill="url(#svg09-bar)"/>
      <rect x="420" y="235" width="96" height="95" rx="2.5" fill="none"
            stroke="var(--color-gold-light)" stroke-opacity="0.5"/>
      <text x="468" y="222" text-anchor="middle" fill="var(--color-gold-light)" font-size="16"
            font-weight="700">206</text>
      <text x="468" y="352" text-anchor="middle" fill="var(--color-gold-light)" font-size="11"
            font-weight="700">After</text>
      <text x="468" y="368" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.5"
            font-size="8.5">Rules notified 2023</text>
    </g>

    <!-- The decline: bracket between bar tops -->
    <g stroke="var(--color-gold)" stroke-opacity="0.6" stroke-width="1.3" fill="none">
      <path d="M 290 70 L 330 70"/>
      <path d="M 330 70 L 330 235"/>
      <path d="M 330 235 L 406 235"/>
    </g>
    <g transform="translate(358,152)" font-family="var(--font-sans)">
      <rect x="-62" y="-30" width="124" height="48" rx="4"
            fill="var(--color-green-deep)" fill-opacity="0.75"
            stroke="var(--color-gold)" stroke-opacity="0.3"/>
      <text text-anchor="middle" fill="var(--color-gold)" font-size="13" font-weight="700">
        −382 units
      </text>
      <text y="16" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.55"
            font-size="9">≈ 65% decline</text>
    </g>
  </g>

  <!-- Interpretation panel on the right -->
  <g transform="translate(600,120)" font-family="var(--font-sans)">
    <rect x="0" y="0" width="170" height="120" rx="5"
          fill="var(--color-green-mid)" fill-opacity="0.16"
          stroke="var(--color-cream)" stroke-opacity="0.14"/>
    <text x="18" y="28" fill="var(--color-gold)" font-size="9" letter-spacing="0.1em"
          font-weight="700">WHY IT MATTERS</text>
    <text x="18" y="50" fill="var(--color-cream)" fill-opacity="0.7" font-size="9.5">
      The fall reflects units
    </text>
    <text x="18" y="63" fill="var(--color-cream)" fill-opacity="0.7" font-size="9.5">
      that closed under the
    </text>
    <text x="18" y="76" fill="var(--color-cream)" fill-opacity="0.7" font-size="9.5">
      2000 Rules — and the
    </text>
    <text x="18" y="89" fill="var(--color-cream)" fill-opacity="0.7" font-size="9.5">
      new category exists to
    </text>
    <text x="18" y="102" fill="var(--color-cream)" fill-opacity="0.7" font-size="9.5">
      let the trade restart.
    </text>
  </g>

  <!-- Source -->
  <text x="130" y="406" font-family="var(--font-sans)" font-size="8.5"
        fill="var(--color-cream)" fill-opacity="0.4" letter-spacing="0.04em">
    Source: WBI Rules 2022, No. 20, eCF No. 237152, dated 12-01-2023 — 588 primary units before, 206 after
  </text>
</svg>
