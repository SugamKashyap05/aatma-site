<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img"
     aria-labelledby="svg11-title svg11-desc">
  <title id="svg11-title">Hojai — the natural capital of the agar trade</title>
  <desc id="svg11-desc">An illustration locating Hojai in Assam as the centre of the
    agar trade, showing its riverine and railway position, the road link to
    Jorhat, and its standing as the main agar oil market of the state.</desc>

  <defs>
    <radialGradient id="svg11-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="var(--color-gold-light)" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="var(--color-gold-light)" stop-opacity="0"/>
    </radialGradient>
    <marker id="svg11-arrow" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-gold)" fill-opacity="0.7"/>
    </marker>
  </defs>

  <!-- ── Hinterland arc: sources feeding Hojai ───────────────────────── -->
  <g transform="translate(0,0)">
    <ellipse cx="400" cy="230" rx="300" ry="150"
             fill="none" stroke="var(--color-green-light)" stroke-opacity="0.18"
             stroke-width="1.2" stroke-dasharray="5 7"/>
    <g fill="var(--color-green-light)" fill-opacity="0.55" font-family="var(--font-sans)"
       font-size="10">
      <!-- Upper Arc: Karbi Anglong -->
      <g transform="translate(140,132)">
        <circle r="4" fill="var(--color-green-light)" fill-opacity="0.8"/>
        <text x="0" y="-12" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.7">Karbi</text>
        <text x="0" y="22" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.7">Anglong</text>
      </g>
      <!-- Naga Hills -->
      <g transform="translate(660,132)">
        <circle r="4" fill="var(--color-green-light)" fill-opacity="0.8"/>
        <text x="0" y="-12" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.7">Naga</text>
        <text x="0" y="22" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.7">Hills</text>
      </g>
      <!-- Lower Arc: Jorhat / Sibsagar -->
      <g transform="translate(140,332)">
        <circle r="4" fill="var(--color-green-light)" fill-opacity="0.8"/>
        <text x="0" y="-12" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.7">Jorhat ·</text>
        <text x="0" y="22" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.7">Sibsagar</text>
      </g>
      <!-- Manipur -->
      <g transform="translate(660,332)">
        <circle r="4" fill="var(--color-green-light)" fill-opacity="0.8"/>
        <text x="0" y="-12" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.7">Manipur</text>
        <text x="0" y="22" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.7">(1970s–80s)</text>
      </g>
    </g>
    <!-- Supply arrows converging inward -->
    <g stroke="var(--color-green-light)" stroke-opacity="0.4" stroke-width="1.4"
       fill="none" marker-end="url(#svg11-arrow)">
      <path d="M 150 150 C 220 160, 290 195, 355 215"/>
      <path d="M 650 150 C 580 160, 510 195, 445 215"/>
      <path d="M 150 314 C 220 300, 290 265, 355 245"/>
      <path d="M 650 314 C 580 300, 510 265, 445 245"/>
    </g>
  </g>

  <!-- ── Hojai hub ───────────────────────────────────────────────────── -->
  <g transform="translate(400,230)" font-family="var(--font-sans)">
    <circle r="88" fill="url(#svg11-glow)"/>
    <circle r="42" fill="var(--color-gold)" fill-opacity="0.16"
            stroke="var(--color-gold)" stroke-opacity="0.55" stroke-width="1.4"/>
    <circle r="8" fill="var(--color-gold-light)"/>
    <text y="-52" text-anchor="middle" fill="var(--color-gold-light)" font-size="22"
          font-weight="700" font-family="var(--font-display)">Hojai</text>
    <text y="-34" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.55"
          font-size="9" letter-spacing="0.12em">DISTRICT HEADQUARTERS</text>
    <text y="62" text-anchor="middle" fill="var(--color-gold)" font-size="9.5"
          font-weight="600" letter-spacing="0.04em">
      Main agar oil market of Assam
    </text>
  </g>

  <!-- ── Connectivity notes around the hub ───────────────────────────── -->
  <g font-family="var(--font-sans)">
    <!-- National Highway -->
    <g transform="translate(196,236)">
      <line x1="0" y1="0" x2="150" y2="0" stroke="var(--color-cream)" stroke-opacity="0.28"
            stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="3" fill="var(--color-cream)" fill-opacity="0.6"/>
      <text x="-8" y="-8" text-anchor="end" fill="var(--color-cream)" fill-opacity="0.55"
            font-size="9">National Highway 27</text>
    </g>
    <!-- Railway -->
    <g transform="translate(410,236)">
      <line x1="0" y1="0" x2="150" y2="0" stroke="var(--color-cream)" stroke-opacity="0.28"
            stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="3" fill="var(--color-cream)" fill-opacity="0.6"/>
      <text x="158" y="-8" fill="var(--color-cream)" fill-opacity="0.55" font-size="9">Railway junction</text>
    </g>
    <!-- The Kopili river -->
    <g transform="translate(0,300)">
      <path d="M 250 40 C 300 20, 340 55, 390 45 S 470 15, 520 40"
            fill="none" stroke="var(--color-green-light)" stroke-opacity="0.4"
            stroke-width="2" stroke-linecap="round"/>
      <text x="290" y="34" fill="var(--color-green-light)" fill-opacity="0.6" font-size="9">
        Kopili river
      </text>
    </g>
  </g>

  <!-- ── Bottom caption band ─────────────────────────────────────────── -->
  <!-- Centred on the 800-wide canvas: the caption is ~566px at 9.5px, so a
       translate of 400 keeps it inside the viewBox. Anchoring at 100 pushed
       roughly 280px of text off the left edge. -->
  <g transform="translate(400,384)" font-family="var(--font-sans)">
    <text text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.55" font-size="9.5">
      Hojai's riverine and railway position made it the natural point where the
      region's raw material met the outside market
    </text>
  </g>

  <!-- ── Source ──────────────────────────────────────────────────────── -->
  <text x="40" y="412" font-family="var(--font-sans)" font-size="8.5"
        fill="var(--color-cream)" fill-opacity="0.4" letter-spacing="0.04em">
    Source: A Brief History of Agar (client document), §2 — Hojai as the agar capital of Assam
  </text>
</svg>
