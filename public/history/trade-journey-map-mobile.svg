<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 900" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">Agar trade chronology and source relationships</title>
  <desc id="map-desc">A vertical schematic based on the association's history, not a geographic map or to scale. It presents the early trade chronology and the places and relationships described there.</desc>
  <style>
    :root { --gold:#c9a84c; --gold-light:#e0c878; --cream:#f5f0e8; --muted:#d7d1c8; --green:#1a3c2a; --sans:Inter,system-ui,sans-serif; }
    text { font-family:var(--sans); }
  </style>
  <rect width="480" height="900" rx="12" fill="var(--green)"/>
  <path d="M42 75 V758" fill="none" stroke="var(--gold)" stroke-width="3" stroke-dasharray="8 8" opacity=".85"/>

  <g fill="var(--gold-light)" stroke="var(--green)" stroke-width="3">
    <circle cx="42" cy="88" r="9"/><circle cx="42" cy="205" r="9"/>
    <circle cx="42" cy="322" r="9"/><circle cx="42" cy="439" r="9"/>
    <circle cx="42" cy="556" r="9"/><circle cx="42" cy="673" r="9"/>
  </g>

  <g fill="var(--cream)">
    <text x="76" y="82" font-size="19" font-weight="700">1905–06 · Sylhet</text>
    <text x="76" y="105" font-size="15" fill="var(--muted)">Agarwood used for extracting oil.</text>

    <text x="76" y="199" font-size="19" font-weight="700">Post-Independence · Barpather</text>
    <text x="76" y="222" font-size="15" fill="var(--muted)">Homestead business; raw agarwood from the</text>
    <text x="76" y="243" font-size="15" fill="var(--muted)">forest mahals of Karbi Angong and Naga Hills.</text>

    <text x="76" y="316" font-size="19" font-weight="700">No year stated · Hojai</text>
    <text x="76" y="339" font-size="15" fill="var(--muted)">Small-scale distillation began.</text>

    <text x="76" y="433" font-size="19" font-weight="700">A few years later · Naharani,</text>
    <text x="76" y="455" font-size="19" font-weight="700">Jorhat and Sibsagar</text>
    <text x="76" y="478" font-size="15" fill="var(--muted)">Trade and distillery business using agarwood</text>
    <text x="76" y="499" font-size="15" fill="var(--muted)">harvested from homegrown trees.</text>

    <text x="76" y="550" font-size="19" font-weight="700">Late 1960s · NEFA and Bhutan</text>
    <text x="76" y="573" font-size="15" fill="var(--muted)">A Hojai group leased agar mahals, collected</text>
    <text x="76" y="594" font-size="15" fill="var(--muted)">agar there and brought it to Hojai.</text>

    <text x="76" y="667" font-size="19" font-weight="700">1970–1980s · Manipur</text>
    <text x="76" y="690" font-size="15" fill="var(--muted)">Hojai and Silchar entrepreneurs collected</text>
    <text x="76" y="711" font-size="15" fill="var(--muted)">Manipur agar for processing and distillation.</text>
    <text x="76" y="732" font-size="15" fill="var(--muted)">Products went to Bombay under a Lieu T.P.</text>
  </g>

  <line x1="24" y1="780" x2="456" y2="780" stroke="var(--cream)" stroke-opacity=".28"/>
  <text x="24" y="814" fill="var(--gold-light)" font-family="var(--sans)" font-size="16" font-weight="700">Trade chronology</text>
  <text x="24" y="842" fill="var(--muted)" font-family="var(--sans)" font-size="14">Schematic, not geographic or to scale.</text>
  <text x="24" y="872" fill="var(--muted)" font-family="var(--sans)" font-size="13">Schematic — not to geographic scale</text>
</svg>
