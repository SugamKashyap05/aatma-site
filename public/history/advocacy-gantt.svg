<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img"
     aria-labelledby="svg04-title svg04-desc">
  <title id="svg04-title">Twenty-three years of advocacy, 2000 to 2023</title>
  <desc id="svg04-desc">A timeline of AATMA's representations to government across
    five successive Assam governments — AGP, three Congress governments and BJP —
    from the 2000 Rules that brought uncertainty, through repeated rejected
    memorandums and the Central Empowered Committee recommendation the Assam
    Cabinet declined, to the 2022 Rules notified on 12 January 2023.</desc>

  <defs>
    <linearGradient id="svg04-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="var(--color-gold)" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="var(--color-gold)" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="svg04-bar-ok" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="var(--color-green-light)" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="var(--color-gold-light)" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- ── Government bands ─────────────────────────────────────────────── -->
  <!-- Five successive governments across the 23-year period.
       Bands are drawn as alternating tints of the green token. -->
  <g font-family="var(--font-sans)">
    <!-- AGP (2000) -->
    <rect x="60" y="70" width="52" height="300" fill="var(--color-green-mid)" fill-opacity="0.16"/>
    <text x="86" y="386" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.5"
          font-size="9" letter-spacing="0.06em">AGP</text>
    <!-- Congress I (2001-2006) -->
    <rect x="112" y="70" width="186" height="300" fill="var(--color-green-mid)" fill-opacity="0.07"/>
    <text x="205" y="386" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.5"
          font-size="9" letter-spacing="0.06em">CONGRESS</text>
    <!-- Congress II (2006-2011) -->
    <rect x="298" y="70" width="186" height="300" fill="var(--color-green-mid)" fill-opacity="0.16"/>
    <text x="391" y="386" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.5"
          font-size="9" letter-spacing="0.06em">CONGRESS</text>
    <!-- Congress III (2011-2016) -->
    <rect x="484" y="70" width="176" height="300" fill="var(--color-green-mid)" fill-opacity="0.07"/>
    <text x="572" y="386" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.5"
          font-size="9" letter-spacing="0.06em">CONGRESS</text>
    <!-- BJP (2016-2023) -->
    <rect x="660" y="70" width="100" height="300" fill="var(--color-gold)" fill-opacity="0.07"/>
    <text x="710" y="386" text-anchor="middle" fill="var(--color-gold)" fill-opacity="0.75"
          font-size="9" letter-spacing="0.06em">BJP</text>
  </g>

  <!-- ── The 23-year bar ──────────────────────────────────────────────── -->
  <g transform="translate(60,96)">
    <rect x="0" y="0" width="700" height="26" rx="3" fill="url(#svg04-bar)"/>
    <rect x="0" y="0" width="700" height="26" rx="3" fill="none"
          stroke="var(--color-gold)" stroke-opacity="0.4"/>
    <text x="10" y="17" fill="var(--color-cream)" font-size="11" font-weight="600"
          font-family="var(--font-sans)" letter-spacing="0.03em">
      23 YEARS — five governments, no resolution
    </text>
    <!-- The resolved portion: 2016 turning point to 2023 enactment -->
    <rect x="600" y="0" width="100" height="26" rx="3" fill="url(#svg04-bar-ok)"/>
    <text x="650" y="17" text-anchor="middle" fill="var(--color-green-deep)" font-size="10"
          font-weight="700" font-family="var(--font-sans)">RESOLVED</text>
  </g>

  <!-- ── Axis ─────────────────────────────────────────────────────────── -->
  <g font-family="var(--font-sans)">
    <line x1="60" y1="140" x2="760" y2="140" stroke="var(--color-cream)" stroke-opacity="0.2"/>
    <!-- Year ticks every 5 years: 2000, 2005, 2010, 2015, 2020 -->
    <g fill="var(--color-cream)" fill-opacity="0.45" font-size="9.5">
      <g transform="translate(60,158)"><line x1="0" y1="-18" x2="0" y2="-12" stroke="currentColor" stroke-opacity="0.3"/><text text-anchor="start">2000</text></g>
      <g transform="translate(200,158)"><line x1="0" y1="-18" x2="0" y2="-12" stroke="currentColor" stroke-opacity="0.3"/><text text-anchor="middle">2005</text></g>
      <g transform="translate(340,158)"><line x1="0" y1="-18" x2="0" y2="-12" stroke="currentColor" stroke-opacity="0.3"/><text text-anchor="middle">2010</text></g>
      <g transform="translate(480,158)"><line x1="0" y1="-18" x2="0" y2="-12" stroke="currentColor" stroke-opacity="0.3"/><text text-anchor="middle">2015</text></g>
      <g transform="translate(620,158)"><line x1="0" y1="-18" x2="0" y2="-12" stroke="currentColor" stroke-opacity="0.3"/><text text-anchor="middle">2020</text></g>
      <g transform="translate(760,158)"><text text-anchor="end">2023</text></g>
    </g>
  </g>

  <!-- ── Key events above and below the axis ──────────────────────────── -->
  <!-- x-position maps the year linearly: 2000=60, 2023=760, so 30.4px/year -->

  <!-- 2000: the Rules that created the problem -->
  <g transform="translate(60,140)" font-family="var(--font-sans)">
    <line x1="0" y1="0" x2="0" y2="-52" stroke="var(--color-gold)" stroke-opacity="0.5" stroke-width="1"/>
    <circle r="3.5" fill="var(--color-gold)"/>
    <g transform="translate(0,-58)">
      <text fill="var(--color-gold)" font-size="10" font-weight="700" letter-spacing="0.04em">2000</text>
      <text y="13" fill="var(--color-cream)" font-size="10" font-weight="600">WBI Rules 2000</text>
      <text y="26" fill="var(--color-cream)" fill-opacity="0.55" font-size="8.5">agar units classed as</text>
      <text y="36" fill="var(--color-cream)" fill-opacity="0.55" font-size="8.5">wood-based industries</text>
    </g>
  </g>

  <!-- 26 Jun 2000: first memorandum -->
  <g transform="translate(68,140)" font-family="var(--font-sans)">
    <line x1="0" y1="0" x2="0" y2="46" stroke="var(--color-green-light)" stroke-opacity="0.45" stroke-width="1"/>
    <circle r="3" fill="var(--color-green-light)"/>
    <g transform="translate(0,58)">
      <text fill="var(--color-green-light)" font-size="9" font-weight="700">26 JUN 2000</text>
      <text y="12" fill="var(--color-cream)" fill-opacity="0.7" font-size="8.5">Memorandum to the CM —</text>
      <text y="22" fill="var(--color-cream)" fill-opacity="0.7" font-size="8.5">no action taken</text>
    </g>
  </g>

  <!-- 2001: fresh representation -->
  <g transform="translate(90,140)" font-family="var(--font-sans)">
    <line x1="0" y1="0" x2="0" y2="-72" stroke="var(--color-green-light)" stroke-opacity="0.45" stroke-width="1"/>
    <circle r="3" fill="var(--color-green-light)"/>
    <g transform="translate(0,-78)">
      <text fill="var(--color-green-light)" font-size="9" font-weight="700">2001</text>
      <text y="12" fill="var(--color-cream)" fill-opacity="0.7" font-size="8.5">Fresh representation —</text>
      <text y="22" fill="var(--color-cream)" fill-opacity="0.7" font-size="8.5">pursued repeatedly</text>
    </g>
  </g>

  <!-- Jan 2004: JFMC workshop -->
  <g transform="translate(182,140)" font-family="var(--font-sans)">
    <line x1="0" y1="0" x2="0" y2="44" stroke="var(--color-green-light)" stroke-opacity="0.45" stroke-width="1"/>
    <circle r="3" fill="var(--color-green-light)"/>
    <g transform="translate(0,56)">
      <text fill="var(--color-green-light)" font-size="9" font-weight="700">6–7 JAN 2004</text>
      <text y="12" fill="var(--color-cream)" fill-opacity="0.7" font-size="8.5">JFMC workshop,</text>
      <text y="22" fill="var(--color-cream)" fill-opacity="0.7" font-size="8.5">Rabindra Bhavan</text>
    </g>
  </g>

  <!-- Oct 2005: the DFO denial -->
  <g transform="translate(212,140)" font-family="var(--font-sans)">
    <line x1="0" y1="0" x2="0" y2="-66" stroke="var(--color-gold)" stroke-opacity="0.65" stroke-width="1.4"/>
    <circle r="4" fill="var(--color-gold)"/>
    <g transform="translate(0,-72)">
      <text fill="var(--color-gold)" font-size="9.5" font-weight="700">OCT 2005</text>
      <text y="12" fill="var(--color-cream)" font-size="9" font-weight="600">DFO verification denied</text>
      <text y="24" fill="var(--color-cream)" fill-opacity="0.55" font-size="8.5">~7 units ruined · trade</text>
      <text y="34" fill="var(--color-cream)" fill-opacity="0.55" font-size="8.5">moved to Meghalaya & overseas</text>
    </g>
  </g>

  <!-- Mar 2006: CEC recommendation, Cabinet rejected -->
  <g transform="translate(243,140)" font-family="var(--font-sans)">
    <line x1="0" y1="0" x2="0" y2="42" stroke="var(--color-gold)" stroke-opacity="0.65" stroke-width="1.4"/>
    <circle r="4" fill="var(--color-gold)"/>
    <g transform="translate(0,54)">
      <text fill="var(--color-gold)" font-size="9.5" font-weight="700">01 MAR 2006</text>
      <text y="12" fill="var(--color-cream)" font-size="9" font-weight="600">CEC recommends Secondary WBI</text>
      <text y="24" fill="var(--color-cream)" fill-opacity="0.55" font-size="8.5">Assam Cabinet declines</text>
    </g>
  </g>

  <!-- 2010: Delhi conference -->
  <g transform="translate(364,140)" font-family="var(--font-sans)">
    <line x1="0" y1="0" x2="0" y2="-60" stroke="var(--color-green-light)" stroke-opacity="0.45" stroke-width="1"/>
    <circle r="3" fill="var(--color-green-light)"/>
    <g transform="translate(0,-66)">
      <text fill="var(--color-green-light)" font-size="9" font-weight="700">2010</text>
      <text y="12" fill="var(--color-cream)" fill-opacity="0.7" font-size="8.5">Delhi conference —</text>
      <text y="22" fill="var(--color-cream)" fill-opacity="0.7" font-size="8.5">"a state matter"</text>
    </g>
  </g>

  <!-- Aug 2016: the turning point -->
  <g transform="translate(546,140)" font-family="var(--font-sans)">
    <line x1="0" y1="0" x2="0" y2="42" stroke="var(--color-gold-light)" stroke-opacity="0.7" stroke-width="1.4"/>
    <circle r="4" fill="var(--color-gold-light)"/>
    <g transform="translate(0,54)">
      <text fill="var(--color-gold-light)" font-size="9.5" font-weight="700">24 AUG 2016</text>
      <text y="12" fill="var(--color-cream)" font-size="9" font-weight="600">Forest Minister Brahma</text>
      <text y="24" fill="var(--color-cream)" fill-opacity="0.55" font-size="8.5">takes up the cause</text>
    </g>
  </g>

  <!-- Oct 2016: NEDFi conference -->
  <g transform="translate(577,140)" font-family="var(--font-sans)">
    <line x1="0" y1="0" x2="0" y2="-62" stroke="var(--color-gold-light)" stroke-opacity="0.6" stroke-width="1"/>
    <circle r="3" fill="var(--color-gold-light)"/>
    <g transform="translate(0,-68)">
      <text fill="var(--color-gold-light)" font-size="9" font-weight="700">28 OCT 2016</text>
      <text y="12" fill="var(--color-cream)" fill-opacity="0.7" font-size="8.5">NEDFi conference,</text>
      <text y="22" fill="var(--color-cream)" fill-opacity="0.7" font-size="8.5">Guwahati</text>
    </g>
  </g>

  <!-- Jul 2021: delegation to the new CM -->
  <g transform="translate(698,140)" font-family="var(--font-sans)">
    <line x1="0" y1="0" x2="0" y2="-58" stroke="var(--color-gold)" stroke-opacity="0.6" stroke-width="1"/>
    <circle r="3.5" fill="var(--color-gold)"/>
    <g transform="translate(0,-64)">
      <text fill="var(--color-gold)" font-size="9" font-weight="700">19 JUL 2021</text>
      <text y="12" fill="var(--color-cream)" fill-opacity="0.75" font-size="8.5">Delegation with</text>
      <text y="22" fill="var(--color-cream)" fill-opacity="0.75" font-size="8.5">Sirajuddin Ajmal, MLA</text>
    </g>
  </g>

  <!-- 12 Jan 2023: resolution -->
  <g transform="translate(760,140)" font-family="var(--font-sans)">
    <line x1="0" y1="0" x2="0" y2="-74" stroke="var(--color-gold-light)" stroke-opacity="0.85" stroke-width="1.6"/>
    <circle r="5" fill="var(--color-gold-light)"/>
    <g transform="translate(0,-80)">
      <text text-anchor="end" fill="var(--color-gold-light)" font-size="10.5" font-weight="700">12 JAN 2023</text>
      <text y="13" text-anchor="end" fill="var(--color-cream)" font-size="9.5" font-weight="700">WBI Rules 2022 notified</text>
      <text y="26" text-anchor="end" fill="var(--color-green-light)" font-size="8.5">Secondary Wood Based Industry</text>
    </g>
  </g>

  <!-- ── Annotation: the 2005-2016 dead zone ──────────────────────────── -->
  <g transform="translate(380,300)" font-family="var(--font-sans)">
    <rect x="-116" y="-30" width="232" height="42" rx="4"
          fill="var(--color-green-deep)" fill-opacity="0.55"
          stroke="var(--color-cream)" stroke-opacity="0.14"/>
    <text text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.5"
          font-size="8.5" letter-spacing="0.08em">2005–2016</text>
    <text y="14" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.75"
          font-size="9.5">Repeated memorandums · no recognition</text>
  </g>

  <!-- ── Source ───────────────────────────────────────────────────────── -->
  <text x="60" y="430" font-family="var(--font-sans)" font-size="8.5"
        fill="var(--color-cream)" fill-opacity="0.4" letter-spacing="0.04em">
    Sources: A Brief History of Agar §7 (2000–2016 representations) and §8 (2022 Rules); press-meet transcript v2 (23 years, five governments)
  </text>
</svg>
