<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" role="img"
     aria-labelledby="svg03-title svg03-desc">
  <title id="svg03-title">The Far East import era, 1982 onwards</title>
  <desc id="svg03-desc">A diagram showing agarwood imported from Malaysia,
    Indonesia, Thailand and Cambodia into Hojai, processed and distilled there,
    then re-exported as finished products. Notes the roughly 5,000 people
    employed in Hojai's processing and distilling workforce at that time.</desc>

  <defs>
    <marker id="svg03-arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-gold)" fill-opacity="0.7"/>
    </marker>
    <linearGradient id="svg03-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--color-green-mid)" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="var(--color-green-mid)" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- ── Source countries (left) ──────────────────────────────────────── -->
  <g font-family="var(--font-sans)" transform="translate(40,0)">
    <text fill="var(--color-cream)" fill-opacity="0.45" font-size="9"
          letter-spacing="0.14em">FAR EAST — RAW SOURCE</text>
    <g transform="translate(0,32)">
      <!-- Malaysia -->
      <g transform="translate(0,0)">
        <rect x="0" y="0" width="176" height="42" rx="4" fill="var(--color-green-mid)" fill-opacity="0.22"
              stroke="var(--color-green-light)" stroke-opacity="0.28"/>
        <circle cx="20" cy="21" r="4" fill="var(--color-green-light)"/>
        <text x="36" y="18" fill="var(--color-cream)" font-size="12.5" font-weight="600">Malaysia</text>
        <text x="36" y="32" fill="var(--color-cream)" fill-opacity="0.5" font-size="9">abundant agarwood</text>
      </g>
      <!-- Indonesia -->
      <g transform="translate(0,54)">
        <rect x="0" y="0" width="176" height="42" rx="4" fill="var(--color-green-mid)" fill-opacity="0.22"
              stroke="var(--color-green-light)" stroke-opacity="0.28"/>
        <circle cx="20" cy="21" r="4" fill="var(--color-green-light)"/>
        <text x="36" y="18" fill="var(--color-cream)" font-size="12.5" font-weight="600">Indonesia</text>
        <text x="36" y="32" fill="var(--color-cream)" fill-opacity="0.5" font-size="9">abundant agarwood</text>
      </g>
      <!-- Thailand -->
      <g transform="translate(0,108)">
        <rect x="0" y="0" width="176" height="42" rx="4" fill="var(--color-green-mid)" fill-opacity="0.22"
              stroke="var(--color-green-light)" stroke-opacity="0.28"/>
        <circle cx="20" cy="21" r="4" fill="var(--color-green-light)"/>
        <text x="36" y="18" fill="var(--color-cream)" font-size="12.5" font-weight="600">Thailand</text>
      </g>
      <!-- Cambodia -->
      <g transform="translate(0,162)">
        <rect x="0" y="0" width="176" height="42" rx="4" fill="var(--color-green-mid)" fill-opacity="0.22"
              stroke="var(--color-green-light)" stroke-opacity="0.28"/>
        <circle cx="20" cy="21" r="4" fill="var(--color-green-light)"/>
        <text x="36" y="18" fill="var(--color-cream)" font-size="12.5" font-weight="600">Cambodia</text>
      </g>
    </g>
  </g>

  <!-- ── Import arrows converging on Hojai ────────────────────────────── -->
  <g stroke="var(--color-gold)" stroke-opacity="0.55" stroke-width="1.8" fill="none"
     marker-end="url(#svg03-arrow)">
    <path d="M 222 74 C 300 74, 340 150, 400 176"/>
    <path d="M 222 128 C 300 128, 340 160, 400 182"/>
    <path d="M 222 182 C 300 182, 340 172, 400 190"/>
    <path d="M 222 236 C 300 236, 340 200, 400 200"/>
  </g>

  <!-- Import annotation -->
  <g transform="translate(300,120)" font-family="var(--font-sans)">
    <rect x="-52" y="-24" width="104" height="40" rx="4"
          fill="var(--color-green-deep)" fill-opacity="0.7"
          stroke="var(--color-gold)" stroke-opacity="0.25"/>
    <text text-anchor="middle" fill="var(--color-gold)" font-size="8.5" letter-spacing="0.08em">IMPORT</text>
    <text y="13" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.75" font-size="8.5">Exim Policy</text>
    <text y="23" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.5" font-size="7.5">heavy duties paid</text>
  </g>

  <!-- ── Hojai — the processing centre ────────────────────────────────── -->
  <g transform="translate(410,150)" font-family="var(--font-sans)">
    <!-- Standstill marker: the trade stopped in 1982 before the Far East discovery -->
    <rect x="0" y="-96" width="230" height="26" rx="3"
          fill="var(--color-green-mid)" fill-opacity="0.14"
          stroke="var(--color-cream)" stroke-opacity="0.12"/>
    <text x="12" y="-78" fill="var(--color-cream)" fill-opacity="0.55" font-size="9.5">
      Manipur supply ran dry — trade at a standstill in 1982
    </text>

    <rect x="0" y="-60" width="230" height="196" rx="6"
          fill="var(--color-gold)" fill-opacity="0.10"
          stroke="var(--color-gold)" stroke-opacity="0.45" stroke-width="1.2"/>
    <text x="115" y="-40" text-anchor="middle" fill="var(--color-gold)" font-size="9"
          letter-spacing="0.14em">PROCESSING CENTRE</text>
    <text x="115" y="-16" text-anchor="middle" fill="var(--color-gold-light)" font-size="19"
          font-weight="700" font-family="var(--font-display)">Hojai</text>
    <text x="115" y="0" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.6"
          font-size="9.5">Assam</text>

    <!-- The two processing outputs -->
    <g transform="translate(18,18)">
      <rect x="0" y="0" width="92" height="52" rx="4" fill="var(--color-green-mid)" fill-opacity="0.3"
            stroke="var(--color-green-light)" stroke-opacity="0.3"/>
      <text x="46" y="21" text-anchor="middle" fill="var(--color-cream)" font-size="10.5" font-weight="600">Distillation</text>
      <text x="46" y="36" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.55" font-size="8.5">agar oil</text>
    </g>
    <g transform="translate(120,18)">
      <rect x="0" y="0" width="92" height="52" rx="4" fill="var(--color-green-mid)" fill-opacity="0.3"
            stroke="var(--color-green-light)" stroke-opacity="0.3"/>
      <text x="46" y="21" text-anchor="middle" fill="var(--color-cream)" font-size="10.5" font-weight="600">Processing</text>
      <text x="46" y="36" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.55" font-size="8.5">chips &amp; wood</text>
    </g>

    <!-- Employment figure -->
    <g transform="translate(115,96)">
      <text text-anchor="middle" fill="var(--color-gold-light)" font-size="22" font-weight="700"
            font-family="var(--font-display)">~5,000</text>
      <text y="16" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.6" font-size="8.5"
            letter-spacing="0.06em">PEOPLE EMPLOYED</text>
    </g>
  </g>

  <!-- ── Re-export arrows (right) ─────────────────────────────────────── -->
  <g stroke="var(--color-gold-light)" stroke-opacity="0.6" stroke-width="1.8" fill="none"
     marker-end="url(#svg03-arrow)">
    <path d="M 648 190 C 690 190, 700 130, 730 120"/>
    <path d="M 648 200 L 726 200"/>
    <path d="M 648 210 C 690 210, 700 270, 730 280"/>
  </g>

  <!-- ── Destinations (right) ─────────────────────────────────────────── -->
  <g font-family="var(--font-sans)" transform="translate(736,0)">
    <text fill="var(--color-cream)" fill-opacity="0.45" font-size="9"
          letter-spacing="0.14em" text-anchor="end" x="60">FINISHED PRODUCTS</text>
    <g transform="translate(0,32)">
      <g transform="translate(0,88)">
        <rect x="0" y="0" width="60" height="34" rx="4" fill="var(--color-gold)" fill-opacity="0.12"
              stroke="var(--color-gold)" stroke-opacity="0.3"/>
        <text x="30" y="21" text-anchor="middle" fill="var(--color-cream)" font-size="9.5" font-weight="600">Europe</text>
      </g>
      <g transform="translate(0,168)">
        <rect x="0" y="0" width="60" height="34" rx="4" fill="var(--color-gold)" fill-opacity="0.12"
              stroke="var(--color-gold)" stroke-opacity="0.3"/>
        <text x="30" y="21" text-anchor="middle" fill="var(--color-cream)" font-size="9.5" font-weight="600">Middle East</text>
      </g>
      <g transform="translate(0,248)">
        <rect x="0" y="0" width="60" height="34" rx="4" fill="var(--color-gold)" fill-opacity="0.12"
              stroke="var(--color-gold)" stroke-opacity="0.3"/>
        <text x="30" y="21" text-anchor="middle" fill="var(--color-cream)" font-size="9.5" font-weight="600">India</text>
      </g>
    </g>
  </g>

  <!-- Re-export label -->
  <g transform="translate(688,240)" font-family="var(--font-sans)">
    <text text-anchor="middle" fill="var(--color-gold-light)" font-size="8.5" letter-spacing="0.1em">RE-EXPORT</text>
    <text y="12" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.5" font-size="7.5">after processing</text>
  </g>

  <!-- ── Source ───────────────────────────────────────────────────────── -->
  <text x="40" y="398" font-family="var(--font-sans)" font-size="8.5"
        fill="var(--color-cream)" fill-opacity="0.4" letter-spacing="0.04em">
    Source: A Brief History of Agar (client document), §4 — new dimension to agar trade due to discovery of wild agarwood in the Far East
  </text>
</svg>
