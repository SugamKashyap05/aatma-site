<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img"
     aria-labelledby="svg08-title svg08-desc">
  <title id="svg08-title">Growth of the AATMA membership</title>
  <desc id="svg08-desc">A vertical bar chart of AATMA membership from 24 traders
    at founding in 1976, through 92 in 2000 and 116 in 2016, to 138 registered
    members as reported at the 2023 press meet.</desc>

  <defs>
    <linearGradient id="svg08-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="var(--color-green-light)" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="var(--color-gold)" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <!-- Plot area: x 100..740, y 60..330 -->
  <!-- Max value 138 maps to y 60; 0 maps to y 330. Scale = 270/138 = 1.9565 -->
  <g font-family="var(--font-sans)">

    <!-- Gridlines and y-axis labels -->
    <g stroke="var(--color-cream)" stroke-opacity="0.1">
      <line x1="100" y1="60"  x2="740" y2="60"/>
      <line x1="100" y1="138" x2="740" y2="138"/>
      <line x1="100" y1="216" x2="740" y2="216"/>
      <line x1="100" y1="330" x2="740" y2="330" stroke-opacity="0.25"/>
    </g>
    <g fill="var(--color-cream)" fill-opacity="0.4" font-size="9.5" text-anchor="end">
      <text x="88" y="64">140</text>
      <text x="88" y="142">100</text>
      <text x="88" y="220">50</text>
      <text x="88" y="334">0</text>
    </g>
    <text x="100" y="46" fill="var(--color-cream)" fill-opacity="0.45" font-size="9"
          letter-spacing="0.1em">MEMBERS</text>

    <!-- Bars. x centres: 190, 340, 490, 650 -->
    <!-- 24  -> height 47,  top 283 -->
    <!-- 92  -> height 180, top 150 -->
    <!-- 116 -> height 227, top 103 -->
    <!-- 138 -> height 270, top 60  -->

    <!-- 1976: 24 -->
    <g>
      <rect x="150" y="283" width="80" height="47" rx="2.5" fill="url(#svg08-bar)"/>
      <text x="190" y="272" text-anchor="middle" fill="var(--color-cream)" font-size="14"
            font-weight="700">24</text>
      <text x="190" y="352" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.75"
            font-size="11" font-weight="600">1976</text>
      <text x="190" y="368" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.45"
            font-size="8.5">Founding</text>
    </g>

    <!-- 2000: 92 -->
    <g>
      <rect x="300" y="150" width="80" height="180" rx="2.5" fill="url(#svg08-bar)"/>
      <text x="340" y="139" text-anchor="middle" fill="var(--color-cream)" font-size="14"
            font-weight="700">92</text>
      <text x="340" y="352" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.75"
            font-size="11" font-weight="600">2000</text>
      <text x="340" y="368" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.45"
            font-size="8.5">Reorganised</text>
    </g>

    <!-- 2016: 116 -->
    <g>
      <rect x="450" y="103" width="80" height="227" rx="2.5" fill="url(#svg08-bar)"/>
      <text x="490" y="92" text-anchor="middle" fill="var(--color-cream)" font-size="14"
            font-weight="700">116</text>
      <text x="490" y="352" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.75"
            font-size="11" font-weight="600">2016</text>
      <text x="490" y="368" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.45"
            font-size="8.5">Committee</text>
    </g>

    <!-- 2023: 138 -->
    <g>
      <rect x="610" y="60" width="80" height="270" rx="2.5" fill="url(#svg08-bar)"/>
      <rect x="610" y="60" width="80" height="270" rx="2.5" fill="none"
            stroke="var(--color-gold-light)" stroke-opacity="0.5"/>
      <text x="650" y="49" text-anchor="middle" fill="var(--color-gold-light)" font-size="14"
            font-weight="700">138</text>
      <text x="650" y="352" text-anchor="middle" fill="var(--color-gold-light)" font-size="11"
            font-weight="700">2023</text>
      <text x="650" y="368" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.5"
            font-size="8.5">Registered</text>
    </g>

    <!-- Growth annotation: 5.75x across 47 years -->
    <g transform="translate(420,44)">
      <text text-anchor="middle" fill="var(--color-gold)" font-size="9"
            letter-spacing="0.1em" font-weight="700">~5.75× GROWTH · 47 YEARS</text>
    </g>
  </g>

  <!-- Source -->
  <text x="100" y="406" font-family="var(--font-sans)" font-size="8.5"
        fill="var(--color-cream)" fill-opacity="0.4" letter-spacing="0.04em">
    Source: A Brief History of Agar §1 (24 members), §5 (92 in 2000), §10 (116 in 2016); 138 as reported at the press meet, 14 Jan 2023
  </text>
</svg>
