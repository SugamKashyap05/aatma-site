<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img"
     aria-labelledby="svg01-title svg01-desc">
  <title id="svg01-title">Sanchi paat — agar bark as writing material</title>
  <desc id="svg01-desc">A decorative illustration of a piece of sanchi paat, the
    bark of the agar tree used for writing scriptures in Assam, showing flowing
    script in faded ink with warm lamplight from one side.</desc>

  <defs>
    <linearGradient id="svg01-bark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="var(--color-cream-dark)" stop-opacity="0.30"/>
      <stop offset="55%"  stop-color="var(--color-border)" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="var(--color-green-mid)" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="svg01-ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="var(--color-charcoal)" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="var(--color-charcoal)" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="svg01-light" cx="0.22" cy="0.28" r="0.75">
      <stop offset="0%"   stop-color="var(--color-gold-light)" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="var(--color-gold-light)" stop-opacity="0"/>
    </radialGradient>
    <filter id="svg01-fibre" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="ng"/>
      <feComponentTransfer in="ng" result="nf">
        <feFuncA type="linear" slope="0.30" intercept="0"/>
      </feComponentTransfer>
      <feComposite in="nf" in2="SourceGraphic" operator="in" result="fibre"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="fibre"/></feMerge>
    </filter>
  </defs>

  <!-- The bark sheet, slightly rotated for a documentary feel -->
  <g transform="translate(400,200) rotate(-2.5)">

    <!-- Bark body with fibre texture -->
    <rect x="-260" y="-160" width="520" height="320" rx="4"
          fill="url(#svg01-bark)" filter="url(#svg01-fibre)"/>

    <!-- Bark edge: irregular top and bottom borders -->
    <path d="M -260 -160 Q -180 -172, -100 -160 T 60 -166 T 260 -158"
          fill="none" stroke="var(--color-border)" stroke-opacity="0.35" stroke-width="1.5"/>
    <path d="M -260 160 Q -170 150, -80 160 T 70 154 T 260 162"
          fill="none" stroke="var(--color-border)" stroke-opacity="0.30" stroke-width="1.5"/>

    <!-- Vertical bark grain -->
    <g stroke="var(--color-border)" stroke-opacity="0.13" stroke-width="0.8">
      <line x1="-200" y1="-155" x2="-200" y2="155"/>
      <line x1="-140" y1="-158" x2="-140" y2="158"/>
      <line x1="-70"  y1="-156" x2="-70"  y2="157"/>
      <line x1="10"   y1="-157" x2="10"   y2="156"/>
      <line x1="90"   y1="-155" x2="90"   y2="158"/>
      <line x1="160"  y1="-158" x2="160"  y2="155"/>
      <line x1="225"  y1="-156" x2="225"  y2="157"/>
    </g>

    <!-- A split in the bark -->
    <path d="M 130 -160 L 138 -60 L 128 40 L 142 160"
          fill="none" stroke="var(--color-green-deep)" stroke-opacity="0.4" stroke-width="2"/>

    <!-- Warm lamplight from the upper left -->
    <rect x="-260" y="-160" width="520" height="320" rx="4" fill="url(#svg01-light)"/>

    <!-- Script lines: faded ink, drawn as abstract strokes suggesting
         Assamese/Bengali script without rendering legible (or fake) text.
         Deliberately illegible — see note in the accessibility description. -->
    <g fill="url(#svg01-ink)" font-family="var(--font-assamese)">
      <g transform="translate(-215,-115)">
        <rect x="0"   y="0"  width="52" height="4" rx="2" opacity="0.75"/>
        <rect x="60"  y="0"  width="38" height="4" rx="2" opacity="0.65"/>
        <rect x="106" y="0"  width="60" height="4" rx="2" opacity="0.72"/>
        <rect x="174" y="0"  width="44" height="4" rx="2" opacity="0.6"/>
        <rect x="226" y="0"  width="56" height="4" rx="2" opacity="0.7"/>
        <rect x="290" y="0"  width="40" height="4" rx="2" opacity="0.55"/>
        <rect x="338" y="0"  width="58" height="4" rx="2" opacity="0.68"/>
        <rect x="404" y="0"  width="36" height="4" rx="2" opacity="0.5"/>
      </g>
      <g transform="translate(-215,-72)">
        <rect x="0"   y="0" width="46" height="4" rx="2" opacity="0.7"/>
        <rect x="54"  y="0" width="62" height="4" rx="2" opacity="0.66"/>
        <rect x="124" y="0" width="40" height="4" rx="2" opacity="0.72"/>
        <rect x="172" y="0" width="58" height="4" rx="2" opacity="0.62"/>
        <rect x="238" y="0" width="48" height="4" rx="2" opacity="0.7"/>
        <rect x="294" y="0" width="54" height="4" rx="2" opacity="0.58"/>
        <rect x="356" y="0" width="42" height="4" rx="2" opacity="0.66"/>
        <rect x="406" y="0" width="34" height="4" rx="2" opacity="0.48"/>
      </g>
      <g transform="translate(-215,-29)">
        <rect x="0"   y="0" width="58" height="4" rx="2" opacity="0.68"/>
        <rect x="66"  y="0" width="44" height="4" rx="2" opacity="0.62"/>
        <rect x="118" y="0" width="56" height="4" rx="2" opacity="0.7"/>
        <rect x="182" y="0" width="38" height="4" rx="2" opacity="0.58"/>
        <rect x="228" y="0" width="60" height="4" rx="2" opacity="0.68"/>
        <rect x="296" y="0" width="46" height="4" rx="2" opacity="0.6"/>
        <rect x="350" y="0" width="52" height="4" rx="2" opacity="0.64"/>
        <rect x="410" y="0" width="30" height="4" rx="2" opacity="0.45"/>
      </g>
      <g transform="translate(-215,14)">
        <rect x="0"   y="0" width="50" height="4" rx="2" opacity="0.66"/>
        <rect x="58"  y="0" width="56" height="4" rx="2" opacity="0.6"/>
        <rect x="122" y="0" width="42" height="4" rx="2" opacity="0.68"/>
        <rect x="172" y="0" width="62" height="4" rx="2" opacity="0.58"/>
        <rect x="242" y="0" width="40" height="4" rx="2" opacity="0.66"/>
        <rect x="290" y="0" width="58" height="4" rx="2" opacity="0.56"/>
        <rect x="356" y="0" width="48" height="4" rx="2" opacity="0.62"/>
      </g>
      <g transform="translate(-215,57)">
        <rect x="0"   y="0" width="44" height="4" rx="2" opacity="0.62"/>
        <rect x="52"  y="0" width="60" height="4" rx="2" opacity="0.58"/>
        <rect x="120" y="0" width="38" height="4" rx="2" opacity="0.64"/>
        <rect x="166" y="0" width="54" height="4" rx="2" opacity="0.56"/>
        <rect x="228" y="0" width="46" height="4" rx="2" opacity="0.62"/>
        <rect x="282" y="0" width="58" height="4" rx="2" opacity="0.54"/>
        <rect x="348" y="0" width="40" height="4" rx="2" opacity="0.6"/>
        <rect x="396" y="0" width="44" height="4" rx="2" opacity="0.42"/>
      </g>
      <g transform="translate(-215,100)">
        <rect x="0"   y="0" width="56" height="4" rx="2" opacity="0.58"/>
        <rect x="64"  y="0" width="40" height="4" rx="2" opacity="0.54"/>
        <rect x="112" y="0" width="58" height="4" rx="2" opacity="0.6"/>
        <rect x="178" y="0" width="42" height="4" rx="2" opacity="0.52"/>
        <rect x="228" y="0" width="52" height="4" rx="2" opacity="0.58"/>
        <rect x="288" y="0" width="44" height="4" rx="2" opacity="0.5"/>
        <rect x="340" y="0" width="56" height="4" rx="2" opacity="0.56"/>
      </g>
      <!-- Final, shorter line — a closing flourish -->
      <g transform="translate(-215,143)">
        <rect x="0"  y="0" width="38" height="4" rx="2" opacity="0.5"/>
        <rect x="46" y="0" width="52" height="4" rx="2" opacity="0.46"/>
        <rect x="106" y="0" width="30" height="4" rx="2" opacity="0.42"/>
      </g>
    </g>

    <!-- Ink pooling at a few stroke ends, for texture -->
    <g fill="var(--color-charcoal)" opacity="0.3">
      <circle cx="-215" cy="-115" r="2.2"/>
      <circle cx="205"  cy="-72"  r="1.8"/>
      <circle cx="-215" cy="14"   r="2"/>
      <circle cx="188"  cy="57"   r="1.6"/>
    </g>
  </g>

  <!-- ── Caption ──────────────────────────────────────────────────────── -->
  <g transform="translate(60,340)" font-family="var(--font-sans)">
    <text fill="var(--color-gold)" font-size="11" font-weight="600" letter-spacing="0.04em">
      Sanchi paat
    </text>
    <text y="18" fill="var(--color-cream)" fill-opacity="0.55" font-size="9.5">
      Bark of the agar tree, used for writing scriptures
    </text>
  </g>

  <text x="60" y="382" font-family="var(--font-sans)" font-size="8.5"
        fill="var(--color-cream)" fill-opacity="0.4" letter-spacing="0.04em">
    Source: A Brief History of Agar (client document), §1 — agar in Assamese culture
  </text>
</svg>
