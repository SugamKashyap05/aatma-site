<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="route-title route-desc">
  <title id="route-title">Agar trade route and supply relationships — client-drawn path</title>
  <desc id="route-desc">Schematic, not to geographic scale. The client-drawn route connects Sylhet to Hojai, then Barpather, Naharani, Jorhat and Sibsagar, with trade back toward Hojai. Hojai also connects to Karbi Angong and Naga Hills. The market route continues from Hojai through Bombay to the Middle East countries. Pale dashed links show separate reported supply relationships.</desc>
  <style>
    :root { --color-gold:#c9a84c; --color-gold-light:#e0c878; --color-cream:#f5f0e8; --map-source:#f5f0e8; --font-sans:Inter,system-ui,sans-serif; }
    text { font-family:var(--font-sans); }
  </style>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="trade-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="var(--color-gold)"/>
    </marker>
  </defs>
  <rect width="1000" height="600" fill="none"/>

  <!-- Client-drawn trade and market routes. -->
  <g fill="none" stroke="var(--color-gold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Sylhet to Hojai, then the eastern corridor. -->
    <path d="M70 430 C135 407 205 382 270 360"/>
    <path d="M270 360 C310 348 345 332 380 320 C412 307 442 296 475 287 C508 278 535 267 565 258 C600 248 632 237 665 224" marker-end="url(#trade-arrow)"/>
    <!-- Return trade from the regional corridor to Hojai. -->
    <path d="M665 224 C640 330 480 425 275 365" marker-end="url(#trade-arrow)"/>
    <!-- Hojai links to Karbi Angong and Naga Hills; arrows at both ends show two-way trade. -->
    <path d="M276 354 C305 285 344 224 386 188" stroke-width="2.2" marker-start="url(#trade-arrow)" marker-end="url(#trade-arrow)"/>
    <path d="M278 351 C336 267 410 187 485 149" stroke-width="2.2" marker-start="url(#trade-arrow)" marker-end="url(#trade-arrow)"/>
    <!-- Market route: Hojai to Bombay, then Bombay to the Middle East. -->
    <path d="M278 354 C360 310 456 235 575 165" marker-end="url(#trade-arrow)"/>
    <path d="M582 158 C644 116 729 76 805 52" stroke-opacity=".82" marker-end="url(#trade-arrow)"/>
  </g>

  <!-- Distinct reported supply relationships. -->
  <g fill="none" stroke="var(--map-source)" stroke-opacity=".55" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 7">
    <path d="M390 184 C390 225 386 274 380 320"/>
    <path d="M490 145 C465 205 420 267 380 320"/>
    <path d="M165 266 C202 296 235 331 270 360"/>
    <path d="M140 315 C185 326 224 342 270 360"/>
  </g>

  <!-- Reported raw-material sources. -->
  <g fill="var(--color-cream)" fill-opacity=".9" font-size="14">
    <circle cx="390" cy="184" r="5"/><text x="390" y="164" text-anchor="middle">Karbi Angong</text>
    <circle cx="490" cy="145" r="5"/><text x="490" y="124" text-anchor="middle">Naga Hills</text>
    <circle cx="165" cy="266" r="5"/><text x="165" y="246" text-anchor="middle">NEFA · Bhutan</text>
    <circle cx="140" cy="315" r="5"/><text x="140" y="296" text-anchor="middle">Manipur</text>
  </g>

  <!-- Main corridor and regional nodes. -->
  <g>
    <circle cx="70" cy="430" r="7" fill="var(--color-gold)" filter="url(#glow)"/><circle cx="70" cy="430" r="13" fill="none" stroke="var(--color-gold)" stroke-opacity=".4"/>
    <text x="70" y="458" text-anchor="middle" fill="var(--color-cream)" font-size="16" font-weight="700">Sylhet</text>
    <text x="70" y="475" text-anchor="middle" fill="var(--color-gold-light)" font-size="12">1905–06</text>

    <circle cx="270" cy="360" r="9" fill="var(--color-gold-light)" filter="url(#glow)"/><circle cx="270" cy="360" r="17" fill="none" stroke="var(--color-gold-light)" stroke-opacity=".45"/>
    <text x="270" y="397" text-anchor="middle" fill="var(--color-gold-light)" font-size="16" font-weight="700">Hojai</text>
    <text x="270" y="414" text-anchor="middle" fill="var(--color-cream)" fill-opacity=".85" font-size="12">distillation</text>

    <circle cx="380" cy="320" r="6" fill="var(--color-gold)"/>
    <text x="380" y="350" text-anchor="middle" fill="var(--color-cream)" font-size="16" font-weight="600">Barpather</text>
    <text x="380" y="366" text-anchor="middle" fill="var(--color-cream)" fill-opacity=".8" font-size="12">homestead trade</text>

    <circle cx="475" cy="287" r="5.5" fill="var(--color-gold)"/>
    <text x="475" y="317" text-anchor="middle" fill="var(--color-cream)" font-size="16">Naharani</text>

    <circle cx="565" cy="258" r="5.5" fill="var(--color-gold)"/>
    <text x="565" y="288" text-anchor="middle" fill="var(--color-cream)" font-size="16">Jorhat</text>

    <circle cx="665" cy="224" r="6" fill="var(--color-gold)"/>
    <text x="665" y="254" text-anchor="middle" fill="var(--color-cream)" font-size="16">Sibsagar</text>
    <text x="665" y="270" text-anchor="middle" fill="var(--color-cream)" fill-opacity=".8" font-size="12">homegrown trees</text>
  </g>

  <!-- Explicit return-trade label for the reverse corridor. -->
  <text x="485" y="445" text-anchor="middle" fill="var(--color-gold-light)" font-size="12">Trade back to Hojai</text>

  <!-- Market destinations. -->
  <g>
    <circle cx="575" cy="165" r="7" fill="var(--color-gold)" filter="url(#glow)"/>
    <text x="575" y="142" text-anchor="middle" fill="var(--color-cream)" font-size="16" font-weight="700">Bombay</text>
    <text x="592" y="183" text-anchor="start" fill="var(--color-gold-light)" font-size="12">MUMBAI · SALE</text>
    <text x="592" y="199" text-anchor="start" fill="var(--color-cream)" fill-opacity=".85" font-size="12">under Lieu T.P.</text>

    <circle cx="805" cy="52" r="6" fill="var(--color-gold-light)"/>
    <text x="822" y="43" text-anchor="start" fill="var(--color-cream)" font-size="16" font-weight="600">Middle East</text>
    <text x="822" y="60" text-anchor="start" fill="var(--color-cream)" font-size="16" font-weight="600">countries</text>
  </g>

  <!-- Legend and provenance note. -->
  <g transform="translate(70 530)" font-size="12">
    <line x1="0" y1="0" x2="30" y2="0" stroke="var(--color-gold)" stroke-width="2.5" marker-end="url(#trade-arrow)"/>
    <text x="39" y="4" fill="var(--color-cream)" fill-opacity=".9">Route path</text>
    <line x1="124" y1="0" x2="154" y2="0" stroke="var(--color-gold)" stroke-width="2.5" marker-start="url(#trade-arrow)" marker-end="url(#trade-arrow)"/>
    <text x="163" y="4" fill="var(--color-cream)" fill-opacity=".9">Two-way trade</text>
    <circle cx="287" cy="0" r="5" fill="var(--color-gold)"/><text x="300" y="4" fill="var(--color-cream)" fill-opacity=".9">Trade / market node</text>
    <circle cx="475" cy="0" r="5" fill="var(--map-source)"/><text x="488" y="4" fill="var(--color-cream)" fill-opacity=".9">Raw-material source</text>
    <line x1="682" y1="0" x2="716" y2="0" stroke="var(--map-source)" stroke-opacity=".65" stroke-width="1.8" stroke-dasharray="5 6"/>
    <text x="725" y="4" fill="var(--color-cream)" fill-opacity=".9">Reported supply link</text>
  </g>
  <text x="70" y="568" font-family="var(--font-sans)" font-size="12" fill="var(--color-cream)" fill-opacity=".82">Source: client-provided CamScanner 10-23-2026 14.02.pdf, p. 1 · schematic, not to geographic scale</text>
</svg>
