<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img"
     aria-labelledby="svg06-title svg06-desc">
  <title id="svg06-title">How the 12 January 2023 notification benefits the industry</title>
  <desc id="svg06-desc">A sequence diagram showing the four-step compliance path under
    the 2022 Rules: apply as a secondary wood based industry unit, be verified by the
    Competent Authority, obtain a certificate of origin on LPC FORM-XXV, then transport
    and sell within the notified timelines of 62 and 74 days.</desc>

  <defs>
    <marker id="svg06-arrow" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-gold)" fill-opacity="0.8"/>
    </marker>
  </defs>

  <!-- The four steps along a horizontal path -->
  <g font-family="var(--font-sans)">

    <!-- Connecting path behind the step nodes -->
    <line x1="150" y1="150" x2="650" y2="150"
          stroke="var(--color-gold)" stroke-opacity="0.3" stroke-width="2"
          stroke-dasharray="6 6" marker-end="url(#svg06-arrow)"/>

    <!-- ── Step 1 ────────────────────────────────────────────────────── -->
    <g transform="translate(60,110)">
      <circle cx="50" cy="40" r="26" fill="var(--color-green-mid)" fill-opacity="0.35"
              stroke="var(--color-green-light)" stroke-opacity="0.5" stroke-width="1.4"/>
      <text x="50" y="47" text-anchor="middle" fill="var(--color-cream)" font-size="19"
            font-weight="700" font-family="var(--font-display)">1</text>
      <text x="50" y="92" text-anchor="middle" fill="var(--color-gold)" font-size="9"
            letter-spacing="0.1em" font-weight="700">APPLY</text>
      <text x="50" y="110" text-anchor="middle" fill="var(--color-cream)" font-size="11"
            font-weight="600">Register as a</text>
      <text x="50" y="124" text-anchor="middle" fill="var(--color-cream)" font-size="11"
            font-weight="600">secondary WBI unit</text>
      <text x="50" y="144" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.5"
            font-size="8.5">Units up to 2,000 kg</text>
      <text x="50" y="156" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.5"
            font-size="8.5">or 20 vessels</text>
    </g>

    <!-- ── Step 2 ────────────────────────────────────────────────────── -->
    <g transform="translate(245,110)">
      <circle cx="50" cy="40" r="26" fill="var(--color-green-mid)" fill-opacity="0.35"
              stroke="var(--color-green-light)" stroke-opacity="0.5" stroke-width="1.4"/>
      <text x="50" y="47" text-anchor="middle" fill="var(--color-cream)" font-size="19"
            font-weight="700" font-family="var(--font-display)">2</text>
      <text x="50" y="92" text-anchor="middle" fill="var(--color-gold)" font-size="9"
            letter-spacing="0.1em" font-weight="700">VERIFIED</text>
      <text x="50" y="110" text-anchor="middle" fill="var(--color-cream)" font-size="11"
            font-weight="600">Competent Authority</text>
      <text x="50" y="124" text-anchor="middle" fill="var(--color-cream)" font-size="11"
            font-weight="600">inspects the unit</text>
      <text x="50" y="144" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.5"
            font-size="8.5">Plantation stock separated</text>
      <text x="50" y="156" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.5"
            font-size="8.5">from wild collection</text>
    </g>

    <!-- ── Step 3 ────────────────────────────────────────────────────── -->
    <g transform="translate(430,110)">
      <circle cx="50" cy="40" r="26" fill="var(--color-gold)" fill-opacity="0.22"
              stroke="var(--color-gold)" stroke-opacity="0.65" stroke-width="1.4"/>
      <text x="50" y="47" text-anchor="middle" fill="var(--color-gold-light)" font-size="19"
            font-weight="700" font-family="var(--font-display)">3</text>
      <text x="50" y="92" text-anchor="middle" fill="var(--color-gold)" font-size="9"
            letter-spacing="0.1em" font-weight="700">CERTIFIED</text>
      <text x="50" y="110" text-anchor="middle" fill="var(--color-cream)" font-size="11"
            font-weight="600">Certificate of Origin</text>
      <text x="50" y="124" text-anchor="middle" fill="var(--color-gold-light)" font-size="11"
            font-weight="600">LPC FORM-XXV</text>
      <text x="50" y="144" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.5"
            font-size="8.5">Legal sourcing established</text>
      <text x="50" y="156" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.5"
            font-size="8.5">for every consignment</text>
    </g>

    <!-- ── Step 4 ────────────────────────────────────────────────────── -->
    <g transform="translate(615,110)">
      <circle cx="50" cy="40" r="26" fill="var(--color-gold)" fill-opacity="0.22"
              stroke="var(--color-gold)" stroke-opacity="0.65" stroke-width="1.4"/>
      <text x="50" y="47" text-anchor="middle" fill="var(--color-gold-light)" font-size="19"
            font-weight="700" font-family="var(--font-display)">4</text>
      <text x="50" y="92" text-anchor="middle" fill="var(--color-gold)" font-size="9"
            letter-spacing="0.1em" font-weight="700">TRANSPORT</text>
      <text x="50" y="110" text-anchor="middle" fill="var(--color-cream)" font-size="11"
            font-weight="600">Move and sell</text>
      <text x="50" y="124" text-anchor="middle" fill="var(--color-cream)" font-size="11"
            font-weight="600">lawfully</text>
      <text x="50" y="144" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.5"
            font-size="8.5">62 days to register</text>
      <text x="50" y="156" text-anchor="middle" fill="var(--color-cream)" fill-opacity="0.5"
            font-size="8.5">74 days to be processed</text>
    </g>
  </g>

  <!-- ── The outcome band ────────────────────────────────────────────── -->
  <g transform="translate(60,300)" font-family="var(--font-sans)">
    <rect x="0" y="0" width="680" height="46" rx="5"
          fill="var(--color-gold)" fill-opacity="0.09"
          stroke="var(--color-gold)" stroke-opacity="0.32"/>
    <text x="24" y="20" fill="var(--color-gold)" font-size="9" letter-spacing="0.12em"
          font-weight="700">THE OUTCOME</text>
    <text x="24" y="37" fill="var(--color-cream)" fill-opacity="0.8" font-size="10.5">
      A legally sourced, traceable supply chain — replacing the unauthorised channels
      the 2000 Rules forced the industry into
    </text>
  </g>

  <!-- ── Source ──────────────────────────────────────────────────────── -->
  <text x="60" y="368" font-family="var(--font-sans)" font-size="8.5"
        fill="var(--color-cream)" fill-opacity="0.4" letter-spacing="0.04em">
    Source: WBI Rules 2022, No. 20, eCF No. 237152, dated 12-01-2023 — Rule 2 thresholds, timelines and LPC FORM-XXV
  </text>
</svg>
