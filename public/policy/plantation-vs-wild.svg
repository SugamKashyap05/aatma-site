<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 356" role="img"
     aria-labelledby="svg07-title svg07-desc">
  <title id="svg07-title">Whose tree is it — plantation versus wild</title>
  <desc id="svg07-desc">A comparison diagram distinguishing cultivated agar
    plantations, grown on at least 10 hectares and able to supply raw material
    legally, from wild agar trees, protected at the 0.1 hectare threshold, whose
    collection cannot be authorised in practice.</desc>

  <defs>
    <linearGradient id="svg07-cult" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--color-green-light)" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="var(--color-green-light)" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="svg07-wild" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--color-green-mid)" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="var(--color-green-mid)" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- ═══ LEFT PANEL: cultivated ═══════════════════════════════════════ -->
  <g transform="translate(40,40)" font-family="var(--font-sans)">
    <rect x="0" y="0" width="350" height="244" rx="6"
          fill="url(#svg07-cult)" stroke="var(--color-green-light)" stroke-opacity="0.35"/>

    <!-- Plantation icon: rows of trees -->
    <g transform="translate(28,26)">
      <g fill="var(--color-green-light)" fill-opacity="0.75">
        <!-- Three rows of stylised trees -->
        <g transform="translate(0,44)">
          <path d="M 12 0 L 22 26 L 2 26 Z"/><rect x="10" y="26" width="4" height="6" fill="var(--color-green-light)" fill-opacity="0.5"/>
          <path d="M 48 0 L 58 26 L 38 26 Z"/><rect x="46" y="26" width="4" height="6" fill="var(--color-green-light)" fill-opacity="0.5"/>
          <path d="M 84 0 L 94 26 L 74 26 Z"/><rect x="82" y="26" width="4" height="6" fill="var(--color-green-light)" fill-opacity="0.5"/>
          <path d="M 120 0 L 130 26 L 110 26 Z"/><rect x="118" y="26" width="4" height="6" fill="var(--color-green-light)" fill-opacity="0.5"/>
          <path d="M 156 0 L 166 26 L 146 26 Z"/><rect x="154" y="26" width="4" height="6" fill="var(--color-green-light)" fill-opacity="0.5"/>
          <path d="M 192 0 L 202 26 L 182 26 Z"/><rect x="190" y="26" width="4" height="6" fill="var(--color-green-light)" fill-opacity="0.5"/>
          <path d="M 228 0 L 238 26 L 218 26 Z"/><rect x="226" y="26" width="4" height="6" fill="var(--color-green-light)" fill-opacity="0.5"/>
          <path d="M 264 0 L 274 26 L 254 26 Z"/><rect x="262" y="26" width="4" height="6" fill="var(--color-green-light)" fill-opacity="0.5"/>
        </g>
        <g transform="translate(0,14)" fill-opacity="0.5">
          <path d="M 12 0 L 22 26 L 2 26 Z"/>
          <path d="M 84 0 L 94 26 L 74 26 Z"/>
          <path d="M 156 0 L 166 26 L 146 26 Z"/>
          <path d="M 228 0 L 238 26 L 218 26 Z"/>
        </g>
        <!-- Ground line -->
        <line x1="0" y1="78" x2="278" y2="78" stroke="var(--color-green-light)"
              stroke-opacity="0.35" stroke-width="1.5"/>
      </g>

      <text x="0" y="112" fill="var(--color-gold-light)" font-size="9"
            letter-spacing="0.14em" font-weight="700">CULTIVATED PLANTATION</text>
      <text x="0" y="136" fill="var(--color-cream)" font-size="13" font-weight="600">
        Grown by the trader
      </text>
      <text x="0" y="156" fill="var(--color-cream)" fill-opacity="0.55" font-size="10">
        Inoculation plantations on at least
      </text>
      <text x="0" y="170" fill="var(--color-gold)" font-size="11" font-weight="600">10 hectares</text>
    </g>

    <!-- Outcome -->
    <g transform="translate(28,196)">
      <rect x="0" y="0" width="294" height="32" rx="4"
            fill="var(--color-green-light)" fill-opacity="0.14"
            stroke="var(--color-green-light)" stroke-opacity="0.3"/>
      <text x="14" y="20" fill="var(--color-green-light)" font-size="10" font-weight="600">
        ✓ Raw material supply can be legally certified
      </text>
    </g>
  </g>

  <!-- ═══ VS divider ═══════════════════════════════════════════════════ -->
  <g transform="translate(400,162)" font-family="var(--font-sans)">
    <circle cx="0" cy="0" r="20" fill="var(--color-green-deep)"
            stroke="var(--color-cream)" stroke-opacity="0.18"/>
    <text text-anchor="middle" y="4" fill="var(--color-cream)" fill-opacity="0.5"
          font-size="10" font-weight="700" letter-spacing="0.04em">VS</text>
  </g>

  <!-- ═══ RIGHT PANEL: wild ════════════════════════════════════════════ -->
  <g transform="translate(450,40)" font-family="var(--font-sans)">
    <rect x="0" y="0" width="310" height="244" rx="6"
          fill="url(#svg07-wild)" stroke="var(--color-cream)" stroke-opacity="0.16"/>

    <!-- Wild forest icon: scattered irregular trees -->
    <g transform="translate(26,26)">
      <g fill="var(--color-green-mid)" fill-opacity="0.8">
        <!-- Irregular, scattered canopy -->
        <path d="M 30 78 Q 8 78, 12 46 Q 2 40, 14 26 Q 26 12, 40 20 Q 54 8, 62 26 Q 76 30, 68 48 Q 74 78, 48 78 Z"/>
        <path d="M 130 78 Q 112 78, 116 52 Q 108 48, 118 36 Q 128 26, 138 32 Q 148 24, 154 38 Q 164 42, 158 56 Q 162 78, 142 78 Z" fill-opacity="0.65"/>
        <path d="M 208 78 Q 194 78, 198 58 Q 192 54, 200 44 Q 208 36, 216 42 Q 224 36, 228 46 Q 236 50, 232 60 Q 234 78, 218 78 Z" fill-opacity="0.5"/>
        <!-- Ground -->
        <line x1="0" y1="78" x2="250" y2="78" stroke="var(--color-cream)"
              stroke-opacity="0.2" stroke-width="1.5"/>
        <!-- Faint mist -->
        <line x1="10" y1="92" x2="90" y2="92" stroke="var(--color-cream)" stroke-opacity="0.1"/>
        <line x1="140" y1="96" x2="240" y2="96" stroke="var(--color-cream)" stroke-opacity="0.08"/>
      </g>

      <text x="0" y="126" fill="var(--color-cream)" fill-opacity="0.5" font-size="9"
            letter-spacing="0.14em" font-weight="700">WILD / FOREST</text>
      <text x="0" y="150" fill="var(--color-cream)" fill-opacity="0.9" font-size="13"
            font-weight="600">Protected trees</text>
      <text x="0" y="170" fill="var(--color-cream)" fill-opacity="0.5" font-size="10">
        Collection barred below
      </text>
      <text x="0" y="184" fill="var(--color-cream)" font-opacity="0.75" font-size="11"
            font-weight="600">0.1 hectares</text>
    </g>

    <!-- Outcome -->
    <g transform="translate(26,196)">
      <rect x="0" y="0" width="258" height="32" rx="4"
            fill="var(--color-green-deep)" fill-opacity="0.5"
            stroke="var(--color-cream)" stroke-opacity="0.14"/>
      <text x="14" y="20" fill="var(--color-cream)" fill-opacity="0.65" font-size="10"
            font-weight="600">
        ✗ No legal supply available to industry
      </text>
    </g>
  </g>

  <!-- ═══ Bottom annotation ════════════════════════════════════════════ -->
  <g transform="translate(40,296)" font-family="var(--font-sans)">
    <rect x="0" y="0" width="720" height="30" rx="4"
          fill="var(--color-green-deep)" fill-opacity="0.45"
          stroke="var(--color-cream)" stroke-opacity="0.12"/>
    <text x="18" y="19" fill="var(--color-cream)" fill-opacity="0.6" font-size="9.5">
      The Rules therefore push supply toward cultivation — the only source an agar unit
      can lawfully certify.
    </text>
  </g>

  <text x="40" y="344" font-family="var(--font-sans)" font-size="8.5"
        fill="var(--color-cream)" fill-opacity="0.4" letter-spacing="0.04em">
    Source: WBI Rules 2022, No. 20, eCF No. 237152, dated 12-01-2023 — 10 ha plantation and 0.1 ha wild thresholds
  </text>
</svg>
