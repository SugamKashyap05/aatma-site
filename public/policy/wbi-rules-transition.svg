<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 416" role="img"
     aria-labelledby="svg05-title svg05-desc">
  <title id="svg05-title">Wood Based Industries — before and after 2023</title>
  <desc id="svg05-desc">A side-by-side diagram comparing the old regime, in which
    agar processing units of any size fell under wood-based industry rules and were
    blocked from using any legal agarwood, with the new regime from 12 January 2023,
    in which smaller units are recognised as secondary wood based industries and may
    apply for a certificate of origin.</desc>

  <defs>
    <marker id="svg05-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-gold)" fill-opacity="0.75"/>
    </marker>
  </defs>

  <!-- ═══ LEFT: the old regime ═══════════════════════════════════════ -->
  <g transform="translate(40,46)" font-family="var(--font-sans)">
    <text fill="var(--color-cream)" fill-opacity="0.45" font-size="9"
          letter-spacing="0.16em">BEFORE — WBI RULES 2000</text>
    <text y="22" fill="var(--color-cream)" fill-opacity="0.75" font-size="12.5" font-weight="600">
      Agar units classed as wood-based industries
    </text>

    <!-- The blocking condition -->
    <g transform="translate(0,42)">
      <rect x="0" y="0" width="330" height="76" rx="5"
            fill="var(--color-green-mid)" fill-opacity="0.14"
            stroke="var(--color-cream)" stroke-opacity="0.16"/>
      <text x="18" y="26" fill="var(--color-cream)" fill-opacity="0.55" font-size="9"
            letter-spacing="0.08em">THE BLOCK</text>
      <text x="18" y="50" fill="var(--color-cream)" font-size="11.5" font-weight="600">
        No lawful agarwood available to industry
      </text>
      <text x="18" y="66" fill="var(--color-cream)" fill-opacity="0.5" font-size="9">
        Units could not legally process any material
      </text>
    </g>

    <!-- Consequences -->
    <g transform="translate(0,136)">
      <text fill="var(--color-cream)" fill-opacity="0.45" font-size="9"
            letter-spacing="0.12em">CONSEQUENCE</text>
      <g transform="translate(0,16)">
        <rect x="0" y="0" width="330" height="46" rx="4"
              fill="var(--color-green-deep)" fill-opacity="0.45"
              stroke="var(--color-cream)" stroke-opacity="0.1"/>
        <text x="16" y="20" fill="var(--color-cream)" fill-opacity="0.8" font-size="10.5">Units registered but could not operate</text>
        <text x="16" y="35" fill="var(--color-cream)" fill-opacity="0.5" font-size="8.5">Raw material had to be sourced through unauthorised channels</text>
      </g>
      <g transform="translate(0,58)">
        <rect x="0" y="0" width="330" height="46" rx="4"
              fill="var(--color-green-deep)" fill-opacity="0.45"
              stroke="var(--color-cream)" stroke-opacity="0.1"/>
        <text x="16" y="20" fill="var(--color-cream)" fill-opacity="0.8" font-size="10.5">Trade migrated out of Assam</text>
        <text x="16" y="35" fill="var(--color-cream)" fill-opacity="0.5" font-size="8.5">To Meghalaya and overseas after the 2005 denial</text>
      </g>
      <g transform="translate(0,116)">
        <rect x="0" y="0" width="330" height="46" rx="4"
              fill="var(--color-green-deep)" fill-opacity="0.45"
              stroke="var(--color-cream)" stroke-opacity="0.1"/>
        <text x="16" y="20" fill="var(--color-cream)" fill-opacity="0.8" font-size="10.5">23 years without recognition</text>
        <text x="16" y="35" fill="var(--color-cream)" fill-opacity="0.5" font-size="8.5">Five successive Assam governments</text>
      </g>
    </g>
  </g>

  <!-- ═══ Divider ═══════════════════════════════════════════════════ -->
  <line x1="400" y1="46" x2="400" y2="372" stroke="var(--color-cream)" stroke-opacity="0.12"
        stroke-dasharray="3 5"/>

  <!-- ═══ RIGHT: the new regime ══════════════════════════════════════ -->
  <g transform="translate(432,46)" font-family="var(--font-sans)">
    <text fill="var(--color-gold)" font-size="9" letter-spacing="0.16em" font-weight="700">
      AFTER — NOTIFIED 12 JAN 2023
    </text>
    <text y="22" fill="var(--color-gold-light)" font-size="12.5" font-weight="600">
      Secondary Wood Based Industry category
    </text>

    <!-- The enabling condition -->
    <g transform="translate(0,42)">
      <rect x="0" y="0" width="328" height="76" rx="5"
            fill="var(--color-gold)" fill-opacity="0.12"
            stroke="var(--color-gold)" stroke-opacity="0.4" stroke-width="1.2"/>
      <text x="18" y="26" fill="var(--color-gold)" font-size="9"
            letter-spacing="0.08em" font-weight="700">THE PATHWAY</text>
      <text x="18" y="50" fill="var(--color-cream)" font-size="11.5" font-weight="600">
        Certificate of Origin — LPC FORM-XXV
      </text>
      <text x="18" y="66" fill="var(--color-cream)" fill-opacity="0.55" font-size="9">
        Issued by the Competent Authority on verification
      </text>
    </g>

    <!-- What changes -->
    <g transform="translate(0,136)">
      <text fill="var(--color-gold)" fill-opacity="0.75" font-size="9"
            letter-spacing="0.12em">WHAT CHANGES</text>
      <g transform="translate(0,16)">
        <rect x="0" y="0" width="328" height="46" rx="4"
              fill="var(--color-green-mid)" fill-opacity="0.20"
              stroke="var(--color-green-light)" stroke-opacity="0.28"/>
        <text x="16" y="20" fill="var(--color-cream)" font-size="10.5" font-weight="600">Units up to 2,000 kg / 20 vessels</text>
        <text x="16" y="35" fill="var(--color-cream)" fill-opacity="0.5" font-size="8.5">Qualify as secondary WBI under Rule 2</text>
      </g>
      <g transform="translate(0,58)">
        <rect x="0" y="0" width="328" height="46" rx="4"
              fill="var(--color-green-mid)" fill-opacity="0.20"
              stroke="var(--color-green-light)" stroke-opacity="0.28"/>
        <text x="16" y="20" fill="var(--color-cream)" font-size="10.5" font-weight="600">62 days to register · 74 days to be processed</text>
        <text x="16" y="35" fill="var(--color-cream)" fill-opacity="0.5" font-size="8.5">Defined timelines replacing open-ended delay</text>
      </g>
      <g transform="translate(0,116)">
        <rect x="0" y="0" width="328" height="46" rx="4"
              fill="var(--color-green-mid)" fill-opacity="0.20"
              stroke="var(--color-green-light)" stroke-opacity="0.28"/>
        <text x="16" y="20" fill="var(--color-cream)" font-size="10.5" font-weight="600">10 ha vs 0.1 ha cultivation thresholds</text>
        <text x="16" y="35" fill="var(--color-cream)" fill-opacity="0.5" font-size="8.5">Distinguishing plantation from wild collection</text>
      </g>
    </g>
  </g>

  <!-- ═══ The shift arrow ════════════════════════════════════════════ -->
  <g transform="translate(400,208)">
    <line x1="-26" y1="0" x2="22" y2="0" stroke="var(--color-gold)" stroke-opacity="0.7"
          stroke-width="1.8" marker-end="url(#svg05-arrow)"/>
    <text y="-10" text-anchor="middle" fill="var(--color-gold)" font-size="8.5"
          letter-spacing="0.08em" font-family="var(--font-sans)" font-weight="700">
      12 JAN
    </text>
    <text y="18" text-anchor="middle" fill="var(--color-gold)"
          font-family="var(--font-sans)" fill-opacity="0.6" font-size="8">
      2023
    </text>
  </g>

  <!-- ═══ Source ════════════════════════════════════════════════════ -->
  <text x="40" y="404" font-family="var(--font-sans)" font-size="8.5"
        fill="var(--color-cream)" fill-opacity="0.4" letter-spacing="0.04em">
    Source: WBI Rules 2022, No. 20, eCF No. 237152, dated 12-01-2023 (Assam Gazette) — Rule 2, read verbatim from the gazette
  </text>
</svg>
