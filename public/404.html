<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AATMA — All Assam Agar Traders & Agaroil Manufacturers' Association</title>
    <script>
      // SPA redirect: send all 404s back to index.html so React Router can handle them
      const path = window.location.pathname.replace(/\/$/, '');
      if (path && path !== '/aatma-site' && path !== '/aatma-site/') {
        sessionStorage.setItem('spa-redirect', path);
        window.location.replace('/aatma-site/');
      }
    </script>
  </head>
  <body>
    <p>Redirecting…</p>
  </body>
</html>
